# ============================================
# 知识图谱系统配置文件
# ============================================

server:
  port: 8080

spring:
  application:
    name: knowledge-graph

  # ==================== PostgreSQL 数据源（启用 pgvector 扩展） ====================
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/knowledge
    username: root
    password: "123456"

  # ==================== Redis 缓存 ====================
  data:
    redis:
      host: localhost
      port: 6379
      password: "123456"

  # ==================== Spring AI (Ollama) 配置 ====================
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        # 启动时不拉取模型，Ollama 未运行也能启动
        pull-model-strategy: never
        timeout: 300s
      chat:
        options:
          model: deepseek-r1:1.5b
      embedding:
        options:
          model: bge-m3

    # ==================== pgvector 向量库 ====================
    vectorstore:
      pgvector:
        # 默认关闭，打开后启动时建表
        initialize-schema: true
        # 显式指定维度（与 bge-m3 输出一致），避免启动时反查 embedding 模型
        dimensions: 1024
        schema-name: public
        table-name: vector_store
        index-type: hnsw
        distance-type: cosine-distance

# ==================== MyBatis-Plus配置 ====================
mybatis-plus:
  global-config:
    db-config:
      # 主键策略：雪花算法
      id-type: assign_id
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 表名前缀
      table-prefix: kg_
  configuration:
    # 驼峰命名转换
    map-underscore-to-camel-case: true

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.uka.knowledge: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
